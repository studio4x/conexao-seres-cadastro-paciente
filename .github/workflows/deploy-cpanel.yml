name: Deploy cPanel

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-cpanel-production
  cancel-in-progress: false

env:
  CPANEL_USER: conexaoseres
  CPANEL_REPO_PATH: /home/conexaoseres/cadastro.conexaoseres.com.br

jobs:
  deploy:
    name: Atualizar produção no cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Verificar configuração do deploy
        id: config
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_PORT: ${{ secrets.CPANEL_PORT }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          if [[ -z "$CPANEL_HOST" || -z "$CPANEL_SSH_PRIVATE_KEY" ]]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Deploy não executado: configure CPANEL_HOST e CPANEL_SSH_PRIVATE_KEY nos GitHub Actions Secrets."
            exit 0
          fi

          echo "enabled=true" >> "$GITHUB_OUTPUT"

          if [[ -z "$CPANEL_PORT" ]]; then
            echo "CPANEL_PORT=22" >> "$GITHUB_ENV"
          else
            echo "CPANEL_PORT=$CPANEL_PORT" >> "$GITHUB_ENV"
          fi

      - name: Configurar SSH
        if: steps.config.outputs.enabled == 'true'
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
          CPANEL_SSH_PRIVATE_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$CPANEL_SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -T 10 -p "$CPANEL_PORT" -H "$CPANEL_HOST" >> ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Atualizar arquivos no cPanel
        if: steps.config.outputs.enabled == 'true'
        env:
          CPANEL_HOST: ${{ secrets.CPANEL_HOST }}
        shell: bash
        run: |
          ssh \
            -i ~/.ssh/id_ed25519 \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -p "$CPANEL_PORT" \
            "$CPANEL_USER@$CPANEL_HOST" \
            "/usr/bin/git -C $CPANEL_REPO_PATH pull --ff-only origin main"

      - name: Confirmar deploy
        if: steps.config.outputs.enabled == 'true'
        run: echo "Deploy do cPanel concluído para ${GITHUB_SHA}."
