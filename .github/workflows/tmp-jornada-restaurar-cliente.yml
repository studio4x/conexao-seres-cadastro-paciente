name: Validate Jornada restore removed customer

on:
  push:
    branches: [fix/jornada-restaurar-cliente-removido]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/jornada-restaurar-cliente-removido
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared app
        run: npm run build:raw

      - name: Build cPanel and bump version
        run: CONEXAO_SERES_BUMP_IN_CI=1 npm run build:cpanel

      - name: Lint
        run: npm run lint

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate PHP syntax
        run: |
          php -l cpanel-server/api/jornada-yoga.php
          php -l cpanel-dist/api/jornada-yoga.php

      - name: Validate restore contract
        run: |
          grep -q "/restore" cpanel-server/api/jornada-yoga.php
          grep -q "customer-restore-failed" cpanel-server/api/jornada-yoga.php
          grep -q "customer-mismatch" cpanel-server/api/jornada-yoga.php
          grep -q "current.deleted === true" app/api/jornada-yoga/route.ts
          grep -q "customer-restore-failed" app/api/jornada-yoga/route.ts
          grep -q "customer-mismatch" app/api/jornada-yoga/route.ts

      - name: Commit generated package
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add components/layout/AppVersion.tsx cpanel-dist
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: atualiza pacote cPanel com restauração de cliente [generated]"
          git push origin HEAD:fix/jornada-restaurar-cliente-removido
