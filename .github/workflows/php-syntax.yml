name: PHP syntax

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  php-lint:
    name: Lint PHP source and cPanel artifact
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Validate PHP syntax
        run: |
          php -l cpanel-server/api/patients.php
          php -l cpanel-server/api/asaas-webhook.php
          php -l cpanel-dist/api/patients.php
          php -l cpanel-dist/api/asaas-webhook.php
