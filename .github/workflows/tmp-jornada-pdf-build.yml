name: Temporary cPanel PDF build

on:
  push:
    branches:
      - feat/jornada-admin-pdf

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/jornada-admin-pdf
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Build cPanel
        run: CONEXAO_SERES_BUMP_IN_CI=1 npm run build:cpanel
      - name: Commit generated package
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add components/layout/AppVersion.tsx cpanel-dist
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: regenerar pacote cPanel com exportação PDF"
          git push origin HEAD:feat/jornada-admin-pdf
