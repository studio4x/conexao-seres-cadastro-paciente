name: Validate Jornada registration fields

on:
  push:
    branches: [feat/jornada-dados-observacoes-cep-auto]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/jornada-dados-observacoes-cep-auto
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build cPanel and bump version
        run: CONEXAO_SERES_BUMP_IN_CI=1 npm run build:cpanel

      - name: Lint
        run: npm run lint

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate PHP syntax
        run: |
          php -l cpanel-server/api/jornada-yoga.php
          php -l cpanel-dist/api/jornada-yoga.php

      - name: Validate Jornada source contracts
        run: |
          grep -q "Como ficou sabendo da Jornada?" components/jornada-yoga/JornadaYogaPage.tsx
          grep -q "Data de nascimento" lib/jornada-yoga.ts
          grep -q "observations" app/api/jornada-yoga/route.ts
          grep -q "observations" cpanel-server/api/jornada-yoga.php
          ! grep -q "Buscar CEP" components/jornada-yoga/JornadaYogaPage.tsx

      - name: Commit generated package
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add components/layout/AppVersion.tsx cpanel-dist
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: atualiza pacote cPanel com novos dados da Jornada [generated]"
          git push origin HEAD:feat/jornada-dados-observacoes-cep-auto
