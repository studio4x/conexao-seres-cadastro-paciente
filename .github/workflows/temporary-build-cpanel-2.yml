name: Temporary cPanel build 2

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temporary-build-cpanel-2.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Build cPanel
        env:
          CONEXAO_SERES_BUMP_IN_CI: '1'
        run: npm run build:cpanel
      - name: Commit build
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.gitignore')
          text = path.read_text()
          marker = '\n# Temporary migration guard: the production webhook was created manually first.\n# Remove this line after cpanel-dist/api/deploy-webhook.php becomes tracked.\n/cpanel-dist/api/deploy-webhook.php\n'
          path.write_text(text.replace(marker, '\n'))
          PY
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add .gitignore components/layout/AppVersion.tsx cpanel-dist
          git add -f cpanel-dist/api/deploy-webhook.php
          git diff --cached --quiet && exit 1
          git commit -m "build: publish cPanel webhook bundle"
          git pull --rebase origin main
          git push origin main
