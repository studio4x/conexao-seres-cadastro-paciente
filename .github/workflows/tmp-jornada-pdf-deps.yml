name: Temporary PDF dependencies

on:
  push:
    branches:
      - feat/jornada-admin-pdf

permissions:
  contents: write

jobs:
  dependencies:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/jornada-admin-pdf
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PDF dependencies
        run: npm install jspdf jspdf-autotable --save
      - name: Commit dependency lock
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "build: adicionar dependências de exportação PDF"
          git push origin HEAD:feat/jornada-admin-pdf
