name: Validate Jornada 502 and autocomplete fix

on:
  push:
    branches: [fix/jornada-502-autocomplete]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/jornada-502-autocomplete
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared app
        run: npm run build:raw

      - name: Build cPanel and bump version
        run: CONEXAO_SERES_BUMP_IN_CI=1 npm run build:cpanel

      - name: Lint
        run: npm run lint

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate PHP syntax
        run: |
          php -l cpanel-server/api/jornada-yoga.php
          php -l cpanel-dist/api/jornada-yoga.php

      - name: Validate Jornada contracts
        run: |
          grep -q 'autoComplete="tel"' components/jornada-yoga/JornadaYogaPage.tsx
          grep -q 'autoComplete="address-line2"' components/jornada-yoga/JornadaYogaPage.tsx
          grep -q 'autoComplete="address-level3"' components/jornada-yoga/JornadaYogaPage.tsx
          grep -q 'name="cpf"' components/jornada-yoga/JornadaYogaPage.tsx
          grep -q "JOURNEY_CUSTOMER_UPDATE_FAILED" cpanel-server/api/jornada-yoga.php
          grep -q "'stage' => \$journeyStage" cpanel-server/api/jornada-yoga.php
          ! grep -q "if (!jornadaObservationsWithinSafetyBudget(observations))" app/api/jornada-yoga/route.ts

      - name: Commit generated package
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add components/layout/AppVersion.tsx cpanel-dist
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: atualiza pacote cPanel após correção 502 e autocomplete [generated]"
          git push origin HEAD:fix/jornada-502-autocomplete
