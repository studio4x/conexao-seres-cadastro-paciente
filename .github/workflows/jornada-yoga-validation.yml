name: Jornada Yoga validation

on:
  push:
    branches: [feat/jornada-yoga]

permissions:
  contents: write

jobs:
  build:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/jornada-yoga
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Build cPanel and bump version
        run: CONEXAO_SERES_BUMP_IN_CI=1 npm run build:cpanel
      - name: Lint
        run: npm run lint
      - name: Validate Journey PHP syntax
        run: |
          php -l cpanel-server/api/jornada-yoga.php
          php -l cpanel-server/api/jornada-admin-login.php
          php -l cpanel-server/api/jornada-admin-logout.php
          php -l cpanel-server/api/jornada-admin-registrations.php
          php -l cpanel-server/api/asaas-webhook.php
          php -l cpanel-dist/api/jornada-yoga.php
          php -l cpanel-dist/api/jornada-admin-login.php
          php -l cpanel-dist/api/jornada-admin-logout.php
          php -l cpanel-dist/api/jornada-admin-registrations.php
          php -l cpanel-dist/api/asaas-webhook.php
      - name: Commit generated cPanel package
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add components/layout/AppVersion.tsx cpanel-dist
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: gera pacote cPanel da jornada [generated]"
          git push origin HEAD:feat/jornada-yoga
