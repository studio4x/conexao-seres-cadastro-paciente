name: Jornada Yoga validation

on:
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Build cPanel
        run: bash scripts/build-cpanel.sh
      - name: Lint
        run: npm run lint
      - name: Validate Journey PHP syntax
        run: |
          php -l cpanel-server/api/jornada-yoga.php
          php -l cpanel-server/api/jornada-admin-login.php
          php -l cpanel-server/api/jornada-admin-logout.php
          php -l cpanel-server/api/jornada-admin-registrations.php
          php -l cpanel-server/api/asaas-webhook.php
          php -l cpanel-dist/api/jornada-yoga.php
          php -l cpanel-dist/api/jornada-admin-login.php
          php -l cpanel-dist/api/jornada-admin-logout.php
          php -l cpanel-dist/api/jornada-admin-registrations.php
          php -l cpanel-dist/api/asaas-webhook.php
