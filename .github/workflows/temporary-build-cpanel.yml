name: Temporary cPanel migration build

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    if: github.event.head_commit.message == 'ci: run cPanel migration build'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build cPanel and bump version
        env:
          CONEXAO_SERES_BUMP_IN_CI: '1'
        run: npm run build:cpanel

      - name: Finalize webhook migration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.gitignore')
          text = path.read_text()
          text = text.replace('\n# Temporary migration guard: the production webhook was created manually first.\n# Remove this line after cpanel-dist/api/deploy-webhook.php becomes tracked.\n/cpanel-dist/api/deploy-webhook.php\n', '\n')
          path.write_text(text)
          PY

      - name: Commit generated build
        shell: bash
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add .gitignore components/layout/AppVersion.tsx cpanel-dist
          git add -f cpanel-dist/api/deploy-webhook.php
          git diff --cached --quiet && { echo "No generated changes."; exit 1; }
          git commit -m "build: publish cPanel webhook bundle"
          git push origin main
