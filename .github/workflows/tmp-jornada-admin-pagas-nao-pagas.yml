name: Validate Jornada admin paid unpaid

on:
  push:
    branches: [feat/jornada-admin-pagas-nao-pagas]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: feat/jornada-admin-pagas-nao-pagas
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build shared app
        run: npm run build:raw

      - name: Build cPanel and bump version
        run: CONEXAO_SERES_BUMP_IN_CI=1 npm run build:cpanel

      - name: Lint
        run: npm run lint

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate PHP syntax
        run: |
          php -l cpanel-server/api/jornada-admin-registrations.php
          php -l cpanel-dist/api/jornada-admin-registrations.php

      - name: Validate admin paid unpaid contract
        run: |
          grep -q 'value="UNPAID"' components/jornada-yoga/JornadaYogaAdminPage.tsx
          grep -q 'label:"Não pagas"' components/jornada-yoga/JornadaYogaAdminPage.tsx
          grep -q 'unpaid:registrations.filter' app/api/jornada-yoga/admin/registrations/route.ts
          grep -q "'unpaid'=>count" cpanel-server/api/jornada-admin-registrations.php

      - name: Commit generated package
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add components/layout/AppVersion.tsx cpanel-dist
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: atualiza pacote cPanel do admin da Jornada [generated]"
          git push origin HEAD:feat/jornada-admin-pagas-nao-pagas
