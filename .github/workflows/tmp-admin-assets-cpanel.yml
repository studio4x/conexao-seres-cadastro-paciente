name: Validate admin assets cPanel

on:
  push:
    branches: [fix/admin-assets-cpanel]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/admin-assets-cpanel
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build cPanel and bump version
        run: CONEXAO_SERES_BUMP_IN_CI=1 npm run build:cpanel

      - name: Lint
        run: npm run lint

      - name: Validate absolute asset paths
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('cpanel-dist/index.html','utf8');
          if (/src="\.\/assets\//.test(html) || /href="\.\/assets\//.test(html)) {
            throw new Error('Build ainda usa assets relativos');
          }
          if (!/src="\/assets\//.test(html)) throw new Error('JS absoluto não encontrado');
          if (!/href="\/assets\//.test(html)) throw new Error('CSS absoluto não encontrado');
          if (!/href="\/favicon\.svg"/.test(html)) throw new Error('Favicon absoluto não encontrado');
          console.log('Assets absolutos válidos');
          NODE

      - name: Commit generated package
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add components/layout/AppVersion.tsx cpanel-dist
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: atualiza pacote cPanel com assets absolutos [generated]"
          git push origin HEAD:fix/admin-assets-cpanel
