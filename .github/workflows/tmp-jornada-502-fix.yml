name: Validate Jornada 502 fix

on:
  push:
    branches: [fix/jornada-erro-502-json]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/jornada-erro-502-json
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate Jornada observation helpers
        run: |
          node --input-type=module - <<'NODE'
          import {
            buildJornadaObservations,
            mergeJornadaObservations,
            jornadaObservationsUtf8Bytes,
            jornadaObservationsWithinSafetyBudget,
          } from './lib/jornada-yoga.ts';

          const line = buildJornadaObservations('1990-04-15', 'Instagram');
          if (!line.includes('Jornada 2026: Nasc. 15/04/1990 | Origem: Instagram')) {
            throw new Error('Compact observation format invalid');
          }

          const existing = 'Observação clínica preservada';
          const merged = mergeJornadaObservations(existing, '1990-04-15', 'Instagram');
          if (!merged.startsWith(existing + '\nJornada 2026:')) {
            throw new Error('Existing observations were not preserved');
          }

          const replaced = mergeJornadaObservations(merged, '1991-05-16', 'WhatsApp');
          if ((replaced.match(/Jornada 2026:/g) || []).length !== 1) {
            throw new Error('Journey observation must be idempotent');
          }

          const legacy = '[JORNADA DE EXPANSÃO MENTAL E CORPORAL 2026]\nData de nascimento: 15/04/1990\nComo ficou sabendo da Jornada: Instagram\n[/JORNADA DE EXPANSÃO MENTAL E CORPORAL 2026]';
          const migrated = mergeJornadaObservations(legacy, '1990-04-15', 'Instagram');
          if (migrated.includes('[JORNADA DE EXPANSÃO')) {
            throw new Error('Legacy block was not migrated');
          }

          if (!jornadaObservationsWithinSafetyBudget(line) || jornadaObservationsUtf8Bytes(line) > 550) {
            throw new Error('Observation safety budget invalid');
          }

          console.log('Jornada observation helpers valid');
          NODE

      - name: Build cPanel and bump version
        run: CONEXAO_SERES_BUMP_IN_CI=1 npm run build:cpanel

      - name: Lint
        run: npm run lint

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none

      - name: Validate PHP syntax
        run: |
          php -l cpanel-server/api/jornada-yoga.php
          php -l cpanel-dist/api/jornada-yoga.php

      - name: Validate error handling contract
        run: |
          grep -q "JOURNEY_SERVER_EXCEPTION" cpanel-server/api/jornada-yoga.php
          grep -q "JOURNEY_CUSTOMER_CREATE_FAILED" cpanel-server/api/jornada-yoga.php
          grep -q "response.text()" components/jornada-yoga/JornadaYogaPage.tsx
          grep -q "Jornada 2026:" lib/jornada-yoga.ts

      - name: Commit generated package
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add components/layout/AppVersion.tsx cpanel-dist
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: atualiza pacote cPanel após correção do fluxo da Jornada [generated]"
          git push origin HEAD:fix/jornada-erro-502-json
