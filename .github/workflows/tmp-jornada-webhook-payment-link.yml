name: Validate Jornada webhook payment link fix

on:
  push:
    branches: [fix/jornada-webhook-payment-link]

permissions:
  contents: write

jobs:
  validate:
    if: ${{ !contains(github.event.head_commit.message, '[generated]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd
        with:
          ref: fix/jornada-webhook-payment-link
          fetch-depth: 0
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci
      - name: Validate workflow JSON and Code nodes
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const wf = JSON.parse(fs.readFileSync('n8n/conexao-seres-jornada-yoga-v1.4.json','utf8'));
          for (const node of wf.nodes.filter(n => n.type === 'n8n-nodes-base.code')) {
            new Function('$input','$env','$getWorkflowStaticData', node.parameters.jsCode);
          }
          const guard = wf.nodes.find(n => n.name === 'Validar e Deduplicar Inscrição');
          if (!guard.parameters.jsCode.includes('asaas\\.com')) throw new Error('Validação de domínio não encontrada');
          console.log('Workflow JSON e Code nodes válidos');
          NODE
      - name: Build cPanel and bump version
        run: CONEXAO_SERES_BUMP_IN_CI=1 npm run build:cpanel
      - name: Lint
        run: npm run lint
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          coverage: none
      - name: Validate PHP syntax
        run: |
          php -l cpanel-server/api/jornada-yoga.php
          php -l cpanel-dist/api/jornada-yoga.php
      - name: Commit generated package
        run: |
          git config user.name "OpenAI Codex"
          git config user.email "codex@openai.com"
          git add components/layout/AppVersion.tsx cpanel-dist
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "build: atualiza pacote cPanel do webhook da jornada [generated]"
          git push origin HEAD:fix/jornada-webhook-payment-link
